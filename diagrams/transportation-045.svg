<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-label="Signalized intersection approach with a vehicle traveling at 45 miles per hour toward the stop line on a level grade"><rect width="480" height="215" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="40" y="100" width="400" height="44" fill="#9a9a9a" stroke="#1a1a1a" stroke-width="2"/><line x1="40" y1="122" x2="440" y2="122" stroke="#fff" stroke-width="2" stroke-dasharray="10 6"/><rect x="80" y="106" width="34" height="14" fill="#2e86c1" stroke="#1a1a1a" stroke-width="2"/><line x1="122" y1="113" x2="200" y2="113" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><line x1="330" y1="100" x2="330" y2="144" stroke="#1a1a1a" stroke-width="4"/><text x="330" y="92" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a">stop line</text><text x="80" y="92" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">v = 45 mph (66.15 ft/s)</text><text x="240" y="190" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">reaction time 1.0 s, deceleration 10 ft/s², level grade</text></svg>