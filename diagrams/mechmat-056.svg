<svg xmlns="http://www.w3.org/2000/svg" width="380" height="290" viewBox="0 0 380 290" role="img" aria-label="Built-up beam section: connectors carry the shear flow q at the joint"><rect width="380" height="290" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><rect x="100" y="60" width="180" height="34" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="2"/><rect x="168" y="94" width="44" height="130" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="2"/><line x1="100" y1="94" x2="280" y2="94" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/><circle cx="180" cy="94" r="4" fill="#c0392b"/><circle cx="200" cy="94" r="4" fill="#c0392b"/><text x="286.0" y="98.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c0392b">connectors</text><line x1="130" y1="108" x2="170" y2="108" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><text x="150.0" y="126.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">q = VQ/I</text><text x="190.0" y="260.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b7280">V = 18 kip,  Q = 40 in³,  I = 300 in⁴</text></svg>