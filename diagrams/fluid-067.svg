<svg xmlns="http://www.w3.org/2000/svg" width="460" height="250" viewBox="0 0 460 250" role="img" aria-label="Pitot tube facing the flow: measures the stagnation minus static pressure"><rect width="460" height="250" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><line x1="40" y1="110" x2="120" y2="110" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><line x1="40" y1="140" x2="120" y2="140" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><line x1="40" y1="170" x2="120" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><text x="60.0" y="95.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">flow</text><line x1="250" y1="150" x2="370" y2="150" stroke="#1a1a1a" stroke-width="4"/><line x1="370" y1="150" x2="370" y2="60" stroke="#1a1a1a" stroke-width="4"/><circle cx="250" cy="150" r="5" fill="#1a1a1a"/><text x="244.0" y="142.0" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b7280">stagnation (P₀)</text><circle cx="310" cy="143" r="3" fill="#6b7280"/><text x="310.0" y="136.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#6b7280">static (Pₛ)</text><text x="290.0" y="210.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1a1a1a">ΔP = 0.8 kPa,  ρ = 1.2 kg/m³</text></svg>