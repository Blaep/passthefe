<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Block sliding at 4 m/s toward a spring with maximum compression unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- velocity of block --><line x1="150" y1="220" x2="228" y2="220" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="189" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1d4ed8">v = 4 m/s</text><!-- block --><rect x="240" y="170" width="90" height="100" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="285" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">m = 5 kg</text><!-- spring --><path d="M510,220 L498,220 L485,203 L472,237 L459,203 L446,237 L433,203 L420,237 L407,203 L400,220" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><text x="455" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">k = 800 N/m</text><!-- wall --><line x1="520" y1="150" x2="520" y2="290" stroke="#1a1a1a" stroke-width="4"/><path d="M520,162 L532,150 M520,182 L532,170 M520,202 L532,190 M520,222 L532,210 M520,242 L532,230 M520,262 L532,250 M520,282 L532,270" stroke="#1a1a1a" stroke-width="1.4"/><!-- frictionless surface --><line x1="60" y1="270" x2="560" y2="270" stroke="#1a1a1a" stroke-width="2.5"/><path d="M70,270 L60,282 M92,270 L82,282 M114,270 L104,282 M136,270 L126,282 M158,270 L148,282 M180,270 L170,282 M202,270 L192,282 M224,270 L214,282 M246,270 L236,282 M268,270 L258,282 M290,270 L280,282 M312,270 L302,282 M334,270 L324,282 M356,270 L346,282 M378,270 L368,282 M400,270 L390,282 M422,270 L412,282 M444,270 L434,282 M466,270 L456,282 M488,270 L478,282 M510,270 L500,282 M532,270 L522,282 M554,270 L544,282" stroke="#1a1a1a" stroke-width="1.4"/><text x="130" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1a1a1a">frictionless</text><!-- unknown: max compression --><line x1="400" y1="330" x2="520" y2="330" stroke="#1a1a1a" stroke-width="1.2"/><line x1="402" y1="330" x2="428" y2="330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="518" y1="330" x2="492" y2="330" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="400" y1="324" x2="400" y2="336" stroke="#1a1a1a" stroke-width="1.2"/><line x1="520" y1="324" x2="520" y2="336" stroke="#1a1a1a" stroke-width="1.2"/><text x="460" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">&#948; = ?</text></svg>
