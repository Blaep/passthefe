<svg xmlns="http://www.w3.org/2000/svg" width="480" height="185" viewBox="0 0 480 185" role="img" aria-label="Plate moving at 3 feet per second over a stationary surface separated by an oil film 0.01 feet thick"><rect width="480" height="185" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="90" y="56" width="300" height="24" fill="#bdbdbd" stroke="#1a1a1a" stroke-width="2"/><line x1="390" y1="68" x2="450" y2="68" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="420" y="48" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">V = 3.0 ft/s</text><rect x="90" y="80" width="300" height="56" fill="#f3e3a8" stroke="#1a1a1a" stroke-width="2"/><rect x="90" y="136" width="300" height="24" fill="#8f8f8f" stroke="#1a1a1a" stroke-width="2"/><line x1="70" y1="80" x2="70" y2="136" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="62" y="113.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="end" fill="#1a1a1a">0.01 ft</text><text x="240" y="114" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">oil, μ = 0.02 lb-s/ft²</text><text x="240" y="73" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">moving plate</text><text x="240" y="153" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">stationary surface</text></svg>