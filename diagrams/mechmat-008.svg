<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Steel rod snugly fitted between two rigid walls; temperature rises from 20 to 70 degrees Celsius; find the thermal stress"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="12" stroke="#9ca3af" stroke-width="1.6"/></pattern></defs><!-- rigid walls --><rect x="80" y="140" width="60" height="160" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><rect x="500" y="140" width="60" height="160" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="110" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">rigid wall</text><text x="530" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">rigid wall</text><!-- rod --><rect x="140" y="200" width="360" height="60" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><text x="320" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">d = 25 mm</text><text x="320" y="253" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1d4ed8">σ = ?</text><!-- temperature rise --><text x="320" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1d4ed8">T: 20 °C to 70 °C</text><line x1="230" y1="338" x2="230" y2="296" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="320" y1="338" x2="320" y2="296" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="410" y1="338" x2="410" y2="296" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="320" y="362" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1d4ed8">heating</text><text x="320" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">Steel rod, E = 200 GPa, α = 12×10⁻⁶/°C — fitted with no initial stress</text></svg>
