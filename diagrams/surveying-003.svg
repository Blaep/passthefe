<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Compass rose showing line AB at an azimuth of 235 degrees 30 minutes from north"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- compass circle --><circle cx="320" cy="215" r="130" fill="none" stroke="#1a1a1a" stroke-width="2"/><!-- cardinal rays --><line x1="320" y1="215" x2="320" y2="96" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,4"/><line x1="320" y1="215" x2="320" y2="300" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,4"/><line x1="320" y1="215" x2="439" y2="215" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,4"/><line x1="320" y1="215" x2="201" y2="215" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="6,4"/><!-- north arrow --><polygon points="320,96 311,120 329,120" fill="#1d4ed8"/><text x="320" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">N</text><text x="320" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">S</text><text x="466" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">E</text><text x="174" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">W</text><!-- azimuth arc from north clockwise to AB --><path d="M 320,145 A 70,70 0 1,1 262.3,254.6" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><text x="118" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">Azimuth</text><text x="118" y="189" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">235°30′</text><!-- line AB --><line x1="320" y1="215" x2="212.9" y2="288.6" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><circle cx="320" cy="215" r="4.5" fill="#1a1a1a"/><text x="334" y="210" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1a1a1a">A</text><text x="196" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1a1a1a">B</text><!-- bearing arc from south to AB --><path d="M 320,260 A 45,45 0 0,0 282.9,240.5" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="398" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">Bearing AB = ?</text></svg>
