<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840" role="img" aria-label="Distributed load types and their equivalent resultants">
<rect width="680" height="840" fill="#ffffff"/>
<defs>
<marker id="rl-ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker>
<marker id="rl-ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#d43d3d"/></marker>
</defs>
<style>
.rl-t{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:bold;fill:#1a1a1a}
.rl-l{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1a1a1a}
.rl-b{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1d4ed8}
.rl-r{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-weight:bold;fill:#d43d3d}
.rl-m{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;fill:#5a5a5a}
.rl-f{font-family:Georgia,'Times New Roman',serif;font-size:14.5px;fill:#1a1a1a}
</style>

<!-- ============ 1. UNIFORM ============ -->
<g transform="translate(0,0)">
<text class="rl-t" x="24" y="34">1. Uniform</text>
<rect x="60" y="70" width="220" height="62" fill="#1d4ed8" opacity="0.08"/>
<line x1="60" y1="70" x2="280" y2="70" stroke="#1a1a1a" stroke-width="1.4"/>
<g stroke="#1d4ed8" stroke-width="2" marker-end="url(#rl-ah)">
<line x1="80" y1="74" x2="80" y2="128"/><line x1="110" y1="74" x2="110" y2="128"/>
<line x1="140" y1="74" x2="140" y2="128"/><line x1="170" y1="74" x2="170" y2="128"/>
<line x1="200" y1="74" x2="200" y2="128"/><line x1="230" y1="74" x2="230" y2="128"/>
<line x1="260" y1="74" x2="260" y2="128"/>
</g>
<text class="rl-b" x="42" y="108">w</text>
<rect x="60" y="138" width="220" height="9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="170" y1="44" x2="170" y2="134" stroke="#d43d3d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#rl-ahr)"/>
<text class="rl-r" x="178" y="58">F_R = wL</text>
<line x1="60" y1="162" x2="280" y2="162" stroke="#1a1a1a" stroke-width="1"/>
<line x1="60" y1="157" x2="60" y2="167" stroke="#1a1a1a"/><line x1="280" y1="157" x2="280" y2="167" stroke="#1a1a1a"/>
<line x1="60" y1="162" x2="170" y2="162" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="170" y1="162" x2="280" y2="162" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="rl-m" x="100" y="180">L/2</text><text class="rl-m" x="212" y="180">L/2</text>
<text class="rl-f" x="24" y="212">Resultant acts at the midpoint.</text>
</g>

<!-- ============ 2. TRIANGULAR, MAX LEFT ============ -->
<g transform="translate(340,0)">
<text class="rl-t" x="24" y="34">2. Triangular — max at left</text>
<polygon points="60,60 280,138 60,138" fill="#1d4ed8" opacity="0.08"/>
<line x1="60" y1="60" x2="280" y2="138" stroke="#1a1a1a" stroke-width="1.4"/>
<g stroke="#1d4ed8" stroke-width="2" marker-end="url(#rl-ah)">
<line x1="72" y1="68" x2="72" y2="134"/><line x1="108" y1="84" x2="108" y2="134"/>
<line x1="144" y1="100" x2="144" y2="134"/><line x1="180" y1="112" x2="180" y2="134"/>
<line x1="216" y1="122" x2="216" y2="134"/><line x1="252" y1="130" x2="252" y2="134"/>
</g>
<text class="rl-b" x="40" y="104">w</text>
<text class="rl-m" x="284" y="142">0</text>
<rect x="60" y="138" width="220" height="9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="133" y1="44" x2="133" y2="134" stroke="#d43d3d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#rl-ahr)"/>
<text class="rl-r" x="141" y="58">F_R = ½wL</text>
<line x1="60" y1="162" x2="133" y2="162" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="133" y1="162" x2="280" y2="162" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
<text class="rl-m" x="82" y="180">L/3</text><text class="rl-m" x="190" y="180">2L/3</text>
<text class="rl-f" x="24" y="212">L/3 from the max end (centroid of triangle).</text>
</g>

<!-- ============ 3. TRIANGULAR, MAX RIGHT ============ -->
<g transform="translate(0,410)">
<text class="rl-t" x="24" y="34">3. Triangular — max at right</text>
<polygon points="280,60 60,138 280,138" fill="#1d4ed8" opacity="0.08"/>
<line x1="280" y1="60" x2="60" y2="138" stroke="#1a1a1a" stroke-width="1.4"/>
<g stroke="#1d4ed8" stroke-width="2" marker-end="url(#rl-ah)">
<line x1="268" y1="68" x2="268" y2="134"/><line x1="232" y1="84" x2="232" y2="134"/>
<line x1="196" y1="100" x2="196" y2="134"/><line x1="160" y1="112" x2="160" y2="134"/>
<line x1="124" y1="122" x2="124" y2="134"/><line x1="88" y1="130" x2="88" y2="134"/>
</g>
<text class="rl-b" x="286" y="104">w</text>
<text class="rl-m" x="48" y="142">0</text>
<rect x="60" y="138" width="220" height="9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="207" y1="44" x2="207" y2="134" stroke="#d43d3d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#rl-ahr)"/>
<text class="rl-r" x="215" y="58">F_R = ½wL</text>
<line x1="60" y1="162" x2="207" y2="162" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="207" y1="162" x2="280" y2="162" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="rl-m" x="118" y="180">2L/3</text><text class="rl-m" x="232" y="180">L/3</text>
<text class="rl-f" x="24" y="212">Mirror of type 2 — always ⅓ from the fat end.</text>
</g>

<!-- ============ 4. TRAPEZOIDAL ============ -->
<g transform="translate(340,410)">
<text class="rl-t" x="24" y="34">4. Trapezoidal — split it</text>
<polygon points="60,80 280,58 280,138 60,138" fill="#1d4ed8" opacity="0.08"/>
<line x1="60" y1="80" x2="280" y2="80" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="7 5"/>
<line x1="60" y1="80" x2="280" y2="58" stroke="#1a1a1a" stroke-width="1.4"/>
<g stroke="#1d4ed8" stroke-width="2" marker-end="url(#rl-ah)">
<line x1="80" y1="84" x2="80" y2="134"/><line x1="130" y1="79" x2="130" y2="134"/>
<line x1="180" y1="74" x2="180" y2="134"/><line x1="230" y1="68" x2="230" y2="134"/>
<line x1="266" y1="63" x2="266" y2="134"/>
</g>
<text class="rl-b" x="36" y="100">w_A</text>
<text class="rl-b" x="286" y="86">w_B</text>
<text class="rl-m" x="140" y="128">rectangle</text>
<text class="rl-m" x="196" y="73">triangle</text>
<rect x="60" y="138" width="220" height="9" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="164" y1="44" x2="164" y2="134" stroke="#d43d3d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#rl-ahr)"/>
<text class="rl-r" x="172" y="58">F_R</text>
<text class="rl-f" x="24" y="180">F_R = w_A·L + ½(w_B−w_A)·L</text>
<text class="rl-f" x="24" y="204">x̄ = L(2w_A + w_B) ⁄ 3(w_A + w_B) from A</text>
<text class="rl-m" x="24" y="228">Rectangle at L/2 + triangle at L/3 from B,</text>
<text class="rl-m" x="24" y="246">combined with Varignon's theorem.</text>
</g>
</svg>
