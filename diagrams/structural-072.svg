<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="Steel column of length 15 feet with pinned ends at top and bottom carrying an axial load"><rect width="480" height="260" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><g transform="translate(0,30)"><line x1="240" y1="40" x2="240" y2="170" stroke="#1a1a1a" stroke-width="7"/><line x1="240" y1="6" x2="240" y2="35" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><text x="240" y="-2" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">P</text><polygon points="240,172 228.0,190 252.0,190" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/><line x1="220" y1="190" x2="260" y2="190" stroke="#1a1a1a" stroke-width="2"/><circle cx="240" cy="40" r="6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="300" y1="40" x2="300" y2="172" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="308" y="111.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#1a1a1a">L = 15 ft</text><text x="160" y="110" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">pinned</text><text x="160" y="126" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">both ends</text></g></svg>