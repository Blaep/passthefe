<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Sag vertical curve profile with minus 2 percent grade in and plus 3 percent grade out"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- tangent grades (dashed) --><line x1="61" y1="297.6" x2="270" y2="324" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7,5"/><line x1="270" y1="324" x2="479" y2="284.4" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7,5"/><!-- curve --><path d="M80.0,300.0 L99.0,302.2 L118.0,304.2 L137.0,305.8 L156.0,307.2 L175.0,308.2 L194.0,309.0 L213.0,309.5 L232.0,309.6 L251.0,309.4 L270.0,309.0 L289.0,308.2 L308.0,307.2 L327.0,305.8 L346.0,304.2 L365.0,302.2 L384.0,300.0 L403.0,297.5 L422.0,294.6 L441.0,291.4 L460.0,288.0" fill="none" stroke="#1a1a1a" stroke-width="2.8"/><!-- grade labels --><text x="150" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">-2.0%</text><text x="392" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">+3.0%</text><!-- PVC --><circle cx="80" cy="300" r="5" fill="#1a1a1a"/><text x="80" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">PVC 10+00</text><text x="80" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">Elev 100.00 m</text><!-- PVI on tangent --><circle cx="270" cy="324" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="270" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">PVI 11+00</text><!-- tangent offset down to curve point --><line x1="270" y1="324" x2="270" y2="309" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5,4"/><!-- point on curve at PVI station --><circle cx="270" cy="309" r="5.5" fill="#1d4ed8"/><text x="288" y="305" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">Elev = ?</text><!-- PVT --><circle cx="460" cy="288" r="5" fill="#1a1a1a"/><text x="460" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">PVT 12+00</text><!-- length dimension --><line x1="80" y1="408" x2="460" y2="408" stroke="#1a1a1a" stroke-width="1.2"/><line x1="82" y1="408" x2="106" y2="408" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="458" y1="408" x2="434" y2="408" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="80" y1="402" x2="80" y2="414" stroke="#1a1a1a" stroke-width="1.2"/><line x1="460" y1="402" x2="460" y2="414" stroke="#1a1a1a" stroke-width="1.2"/><text x="270" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">L = 200 m</text></svg>
