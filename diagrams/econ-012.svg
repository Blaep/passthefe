oke-width="2.5" marker-end="url(#dn)"/><text x="335.0" y="352.5" text-anchor="middle" font-size="14" fill="#1d4ed8">$10,000</text><line x1="462.5" y1="270" x2="462.5" y2="330.5" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#dn)"/><text x="462.5" y="352.5" text-anchor="middle" font-size="14" fill="#1d4ed8">$10,000</text><line x1="590.0" y1="270" x2="590.0" y2="330.5" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#dn)"/><text x="590.0" y="352.5" text-anchor="middle" font-size="14" fill="#1d4ed8">$10,000</text><text x="80" y="60" font-size="14" fill="#1a1a1a">up = receipts, down = disbursements</text><text x="585" y="250" text-anchor="middle" font-size="26" fill="#1a1a1a">&#8230;</text><text x="585" y="62" text-anchor="middle" font-size="14" fill="#1d4ed8">i = 6% / yr</text></g></svg>