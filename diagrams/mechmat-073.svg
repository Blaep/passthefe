<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230" role="img" aria-label="Bolt bearing on a plate: bearing area is diameter times thickness"><rect width="440" height="230" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><rect x="120" y="90" width="200" height="52" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="2"/><rect x="210" y="66" width="22" height="100" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.6"/><rect x="210" y="90" width="22" height="52" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><line x1="120" y1="116.0" x2="80" y2="116.0" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="76.0" y="112.0" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">P = 80 kN</text><line x1="344" y1="90" x2="344" y2="142" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="330" y="116.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 330 116.0)">t = 10 mm</text><line x1="210" y1="56" x2="232" y2="56" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="221.0" y="72.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1a1a1a">d = 20 mm</text><text x="221.0" y="172.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#1d4ed8">bearing area = d × t</text></svg>