<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Soil profile: 3 m dry sand over 5 m saturated clay, water table at the interface; effective stress at 8 m depth unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- ground surface --><line x1="60" y1="90" x2="580" y2="90" stroke="#1a1a1a" stroke-width="2.5"/><text x="320" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">ground surface</text><!-- dry sand --><rect x="140" y="90" width="360" height="90" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><text x="320" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">dry sand</text><text x="320" y="153" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">γ = 17 kN/m³</text><!-- saturated clay --><rect x="140" y="180" width="360" height="210" fill="#bfdbfe" stroke="#1a1a1a" stroke-width="2.5"/><text x="320" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">saturated clay</text><text x="320" y="273" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">γ_sat = 19 kN/m³</text><!-- water table --><polygon points="190,180 182,168 198,168" fill="#1d4ed8"/><polygon points="450,180 442,168 458,168" fill="#1d4ed8"/><text x="515" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">water table</text><!-- layer dimensions --><line x1="110" y1="92" x2="110" y2="178" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="100" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a" transform="rotate(-90 100 135)">3 m</text><line x1="110" y1="182" x2="110" y2="388" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="100" y="285" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a" transform="rotate(-90 100 285)">5 m</text><line x1="530" y1="92" x2="530" y2="388" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="520" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a" transform="rotate(-90 520 240)">8 m</text><!-- point at 8 m --><circle cx="320" cy="390" r="6" fill="#1d4ed8"/><text x="340" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#1d4ed8">σ′ = ?</text></svg>
