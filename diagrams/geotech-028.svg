<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Gravity retaining wall weighing 120 kN/m acting 1.5 m from the toe, active earth pressure resultant 45 kN/m acting 1.2 m above the base, factor of safety against overturning unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" stroke="#d1d5db" stroke-width="2"/></pattern></defs><rect x="40" y="180" width="140" height="180" fill="#f3f4f6" stroke="none"/><rect x="40" y="180" width="140" height="180" fill="url(#hatch)"/><line x1="40" y1="180" x2="196" y2="180" stroke="#1a1a1a" stroke-width="2.5"/><text x="105" y="225" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">Backfill</text><polygon points="180,360 196,180 262,180 302,360" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="2.5"/><line x1="40" y1="360" x2="560" y2="360" stroke="#1a1a1a" stroke-width="2.5"/><polygon points="294,360 310,360 302,372" fill="#1a1a1a"/><text x="318" y="386" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">Toe</text><line x1="80" y1="290" x2="188" y2="290" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="120" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">45 kN/m</text><line x1="58" y1="360" x2="58" y2="290" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><line x1="52" y1="360" x2="64" y2="360" stroke="#1a1a