<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Two rotors on the same shaft, a rotor of inertia 10 spinning at 6 radians per second and a second stationary rotor of inertia 15, to be coupled"><rect width="480" height="230" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><line x1="60" y1="110" x2="420" y2="110" stroke="#1a1a1a" stroke-width="6"/><rect x="130" y="60" width="26" height="100" fill="#c9d6e8" stroke="#1a1a1a" stroke-width="2"/><rect x="300" y="70" width="26" height="80" fill="#e8d9c9" stroke="#1a1a1a" stroke-width="2"/><text x="143" y="50" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">I = 10.0 kg·m²</text><text x="143" y="180" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">ω = 6.0 rad/s</text><text x="313" y="60" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">I = 15.0 kg·m²</text><text x="313" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">at rest</text><text x="240" y="215" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">coupled onto the same axis, no external torque</text></svg>