e x1="372" y1="360" x2="384" y2="360" stroke="#1a1a1a" stroke-width="1.2"/><text x="392" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">1.5 m</text><!-- resultant force arrow --><line x1="180" y1="300" x2="284" y2="300" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="232" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#1a1a1a">F = ?</text><text x="320" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">gate 2.0 m wide (into the page) × 1.5 m tall</text></svg>
