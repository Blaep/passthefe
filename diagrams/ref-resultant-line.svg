<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img" aria-label="Locating the line of action of a single equivalent resultant: three cases">
<rect width="680" height="900" fill="#ffffff"/>
<defs>
<marker id="rr-ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker>
<marker id="rr-ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#d43d3d"/></marker>
</defs>
<style>
.rr-t{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:bold;fill:#1a1a1a}
.rr-l{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1a1a1a}
.rr-b{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1d4ed8}
.rr-r{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-weight:bold;fill:#d43d3d}
.rr-m{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;fill:#5a5a5a}
.rr-f{font-family:Georgia,'Times New Roman',serif;font-size:14.5px;fill:#1a1a1a}
</style>

<!-- ============ 1. PARALLEL FORCES ============ -->
<g>
<text class="rr-t" x="24" y="34">1. Parallel forces — weight the positions</text>
<rect x="80" y="150" width="520" height="10" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
<g stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#rr-ah)">
<line x1="150" y1="80" x2="150" y2="146"/>
<line x1="330" y1="80" x2="330" y2="146"/>
<line x1="510" y1="80" x2="510" y2="146"/>
</g>
<text class="rr-b" x="142" y="70">F₁</text>
<text class="rr-b" x="322" y="70">F₂</text>
<text class="rr-b" x="502" y="70">F₃</text>
<line x1="370" y1="52" x2="370" y2="146" stroke="#d43d3d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#rr-ahr)"/>
<text class="rr-r" x="378" y="66">R = ΣFᵢ</text>
<line x1="80" y1="182" x2="600" y2="182" stroke="#1a1a1a" stroke-width="1"/>
<g stroke="#1a1a1a" stroke-width="1">
<line x1="150" y1="176" x2="150" y2="188"/><line x1="330" y1="176" x2="330" y2="188"/>
<line x1="510" y1="176" x2="510" y2="188"/><line x1="370" y1="176" x2="370" y2="188"/>
</g>
<text class="rr-m" x="143" y="204">x₁</text><text class="rr-m" x="323" y="204">x₂</text>
<text class="rr-m" x="503" y="204">x₃</text><text class="rr-m" x="363" y="204">x̄</text>
<line x1="150" y1="222" x2="370" y2="222" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="150" y1="217" x2="150" y2="227" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="370" y1="217" x2="370" y2="227" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="rr-b" x="246" y="216">d</text>
<text class="rr-f" x="24" y="252">x̄ = Σ(Fᵢ·xᵢ) ⁄ R — the force-weighted average position. Measure d from whichever force the question names.</text>
</g>

<!-- ============ 2. GENERAL COPLANAR SYSTEM ============ -->
<g transform="translate(0,280)">
<text class="rr-t" x="24" y="34">2. General coplanar system — moment over resultant</text>
<rect x="120" y="130" width="160" height="70" fill="#1d4ed8" opacity="0.06" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="150" cy="180" r="4" fill="#1a1a1a"/>
<text class="rr-l" x="136" y="222">O</text>
<g stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#rr-ah)">
<line x1="150" y1="160" x2="205" y2="160"/>
<line x1="280" y1="160" x2="230" y2="160"/>
<line x1="280" y1="90" x2="280" y2="45"/>
</g>
<text class="rr-b" x="208" y="153">F₁</text>
<text class="rr-b" x="284" y="153">F₂</text>
<text class="rr-b" x="286" y="68">F₃</text>
<line x1="300" y1="330" x2="465" y2="0" stroke="#d43d3d" stroke-width="1.6" stroke-dasharray="8 5"/>
<line x1="443" y1="44" x2="457" y2="16" stroke="#d43d3d" stroke-width="3" marker-end="url(#rr-ahr)"/>
<text class="rr-r" x="461" y="22">R</text>
<line x1="150" y1="180" x2="330" y2="270" stroke="#d43d3d" stroke-width="1.6" stroke-dasharray="5 4"/>
<polyline points="321.9,266 325.9,257.9 334,262" fill="none" stroke="#d43d3d" stroke-width="1.6"/>
<text class="rr-r" x="228" y="216">d</text>
<text class="rr-f" x="24" y="306">d = |ΣM_O| ⁄ |R| — add every force's moment about O (r × F), divide by the resultant's magnitude.</text>
<text class="rr-m" x="24" y="328">Forces through O, or parallel to their own position vector, give zero moment — only the rest matter.</text>
</g>

<!-- ============ 3. FORCE-COUPLE ============ -->
<g transform="translate(0,620)">
<text class="rr-t" x="24" y="34">3. Force plus couple — shift the force</text>
<g stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#rr-ah)">
<line x1="120" y1="110" x2="230" y2="110"/>
</g>
<text class="rr-b" x="238" y="103">F</text>
<path d="M 175 78 A 34 34 0 1 1 148 92" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#rr-ah)"/>
<text class="rr-l" x="196" y="66">M</text>
<line x1="420" y1="110" x2="420" y2="190" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4"/>
<line x1="414" y1="110" x2="426" y2="110" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="414" y1="190" x2="426" y2="190" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="rr-b" x="430" y="155">d = M/F</text>
<g stroke="#d43d3d" stroke-width="3" marker-end="url(#rr-ahr)">
<line x1="120" y1="190" x2="230" y2="190"/>
</g>
<text class="rr-r" x="238" y="183">F alone</text>
<text class="rr-f" x="24" y="232">A force F plus a couple M is exactly one force F, moved sideways by d = M/F</text>
<text class="rr-f" x="24" y="254">— toward the side the couple "pushes". (Clockwise M with →F shifts the line down.)</text>
</g>
</svg>
