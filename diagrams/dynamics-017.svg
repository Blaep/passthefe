<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Uniform rod pinned at one end, held horizontal, with weight acting at its midpoint"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- length dimension --><line x1="150" y1="165" x2="470" y2="165" stroke="#1a1a1a" stroke-width="1.2"/><line x1="152" y1="165" x2="178" y2="165" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="468" y1="165" x2="442" y2="165" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="150" y1="159" x2="150" y2="171" stroke="#1a1a1a" stroke-width="1.2"/><line x1="470" y1="159" x2="470" y2="171" stroke="#1a1a1a" stroke-width="1.2"/><text x="310" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">L = 2 m</text><!-- weight at midpoint --><line x1="310" y1="192" x2="310" y2="220" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="356" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1d4ed8">W = mg</text><!-- rod --><rect x="150" y="222" width="320" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="310" y="262" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">m = 5 kg</text><!-- pin support --><polygon points="115,285 185,285 150,230" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="150" cy="230" r="5" fill="#1a1a1a"/><line x1="80" y1="285" x2="230" y2="285" stroke="#1a1a1a" stroke-width="2.5"/><path d="M90,285 L80,297 M108,285 L98,297 M126,285 L116,297 M144,285 L134,297 M162,285 L152,297 M180,285 L170,297 M198,285 L188,297 M216,285 L206,297" stroke="#1a1a1a" stroke-width="1.4"/><text x="150" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1a1a1a">pin</text><!-- angular acceleration (unknown) --><path d="M415,292 A80,80 0 0,1 550,290" fill="none" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#ah)"/><text x="482" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1a1a1a">&#945; = ?</text></svg>
