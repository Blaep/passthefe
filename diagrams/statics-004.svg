<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Composite cross-section: 4 m by 3 m rectangle with a triangle of base 4 m and height 2 m on top; y-bar measured from the bottom marked unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- composite outline: rectangle + triangle --><path d="M 180,380 L 180,170 L 320,30 L 460,170 L 460,380 Z" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- shared edge: top of rectangle = base of triangle --><line x1="180" y1="170" x2="460" y2="170" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="7,5"/><!-- y-bar reference line (schematic position) --><line x1="170" y1="205" x2="525" y2="205" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="7,5"/><circle cx="320" cy="205" r="5" fill="#1d4ed8"/><!-- y-bar dimension from bottom --><line x1="105" y1="205" x2="105" y2="380" stroke="#1a1a1a" stroke-width="1.2"/><line x1="105" y1="203" x2="105" y2="179" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="105" y1="382" x2="105" y2="406" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="99" y1="205" x2="111" y2="205" stroke="#1a1a1a" stroke-width="1.2"/><line x1="99" y1="380" x2="111" y2="380" stroke="#1a1a1a" stroke-width="1.2"/><text x="82" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a" transform="rotate(-90 82 292)">y-bar = ?</text><!-- 3 m vertical dimension --><line x1="150" y1="170" x2="150" y2="380" stroke="#1a1a1a" stroke-width="1.2"/><line x1="150" y1="172" x2="150" y2="148" stroke="#1a1a1a" stroke-width="1.6" marker-end="url