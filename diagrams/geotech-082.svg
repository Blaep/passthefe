<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-label="Strip footing with its base 4 feet below the ground surface in saturated clay with cohesion 1,200 psf and unit weight 115 pounds per cubic foot, groundwater deep"><rect width="480" height="215" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="40" y="40" width="400" height="160" fill="#efe3c7" stroke="#1a1a1a" stroke-width="2"/><rect x="205" y="40" width="70" height="0" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="190" y="78" width="100" height="14" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><rect x="225" y="40" width="30" height="38" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><line x1="240" y1="10" x2="240" y2="38" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><text x="255" y="24" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">strip footing, load per ft</text><line x1="140" y1="40" x2="140" y2="92" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="132" y="71.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="end" fill="#1a1a1a">D<tspan dy="4" font-size="11">f</tspan><tspan dy="-4">​</tspan> = 4 ft</text><text x="240" y="150" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">saturated clay, φ = 0</text><text x="240" y="172" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1