<svg xmlns="http://www.w3.org/2000/svg" width="480" height="225" viewBox="0 0 480 225" role="img" aria-label="Overconsolidated clay layer 8 feet thick with initial effective stress 2,000 psf, preconsolidation stress 3,500 psf and final stress 3,000 psf"><rect width="480" height="225" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="110" y="50" width="320" height="150" fill="#e0cfa8" stroke="#1a1a1a" stroke-width="2"/><text x="270" y="108" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">overconsolidated clay</text><text x="270" y="130" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">e<tspan dy="4" font-size="11">0</tspan><tspan dy="-4">​</tspan> = 0.80, C<tspan dy="4" font-size="11">C</tspan><tspan dy="-4">​</tspan> = 0.36</text><text x="270" y="152" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">σ′<tspan dy="4" font-size="11">0</tspan><tspan dy="-4">​</tspan> = 2,000 psf, σ′<tspan dy="4" font-size="11">c</tspan><tspan dy="-4">​</tspan> = 3,500 psf</text><line x1="90" y1="50" x2="90" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="82" y="130.0" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="end" fill="#1a1a1a">H = 8 ft</text><text x="270" y="176" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">σ′<tspan dy="4" font-size="11">f</tspan><tspan dy="-4">​</tsp