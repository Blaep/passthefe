<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img"><rect width="640" height="360" fill="#ffffff"/><text x="320" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1a1a1a">Time–cost tradeoff (cost slope)</text><g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a"><line x1="90" y1="290" x2="590" y2="290" stroke="#1a1a1a" stroke-width="1.6"/><line x1="90" y1="290" x2="90" y2="70" stroke="#1a1a1a" stroke-width="1.6"/><text x="340" y="326" text-anchor="middle">Activity duration (days)</text><text x="34" y="180" text-anchor="middle" transform="rotate(-90 34 180)">Direct cost ($)</text><line x1="180" y1="130" x2="340" y2="230" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="340" cy="230" r="6" fill="#1a1a1a"/><circle cx="180" cy="130" r="6" fill="#1a1a1a"/><text x="340" y="262" text-anchor="middle">Normal: 10 days, $20,000</text><text x="180" y="112" text-anchor="middle">Crash: 6 days, $28,000</text><text x="262" y="200" text-anchor="middle" font-size="16" fill="#1d4ed8">slope = Δ$/Δt</text><text x="262" y="222" text-anchor="middle" font-size="16" fill="#1d4ed8">= $8,000 / 4 days</text></g></svg>
