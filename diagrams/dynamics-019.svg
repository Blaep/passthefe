<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Conical pendulum: 1.0 m cord at 30 degrees from vertical, mass swinging in a horizontal circle"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- ceiling --><line x1="60" y1="90" x2="560" y2="90" stroke="#1a1a1a" stroke-width="2.5"/><path d="M70,90 L60,78 M92,90 L82,78 M114,90 L104,78 M136,90 L126,78 M158,90 L148,78 M180,90 L170,78 M202,90 L192,78 M224,90 L214,78 M246,90 L236,78 M268,90 L258,78 M290,90 L280,78 M312,90 L302,78 M334,90 L324,78 M356,90 L346,78 M378,90 L368,78 M400,90 L390,78 M422,90 L412,78 M444,90 L434,78 M466,90 L456,78 M488,90 L478,78 M510,90 L500,78 M532,90 L522,78 M554,90 L544,78" stroke="#1a1a1a" stroke-width="1.4"/><!-- pivot --><circle cx="320" cy="90" r="4" fill="#1a1a1a"/><!-- vertical reference (dashed) --><line x1="320" y1="96" x2="320" y2="300" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="7,5"/><!-- 30-degree angle arc --><path d="M320,135 A45,45 0 0,0 342.5,129" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="354" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">30&#176;</text><!-- cord --><line x1="320" y1="90" x2="430" y2="281" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">1.0 m</text><!-- horizontal circular path (dashed) --><ellipse cx="320" cy="281" rx="110" ry="30" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="8,6"/><!-- mass --><circle cx="430" cy="281" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><text x="494" y="287" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">m = 2 kg</text><!-- direction of motion --><path d="M428.3,275.8 A110,30 0 0,1 419.7,293.7" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="470" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1d4ed8">v = ?</text></svg>
