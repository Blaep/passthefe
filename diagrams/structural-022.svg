<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Beam fixed at both ends spanning 6 m; a 20 kN load acts 2 m from the left support; find the left fixed-end moment"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="12" stroke="#9ca3af" stroke-width="1.6"/></pattern></defs><!-- beam --><rect x="60" y="230" width="520" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><!-- fixed walls --><rect x="60" y="160" width="50" height="150" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><rect x="530" y="160" width="50" height="150" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="85" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">fixed</text><text x="555" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">fixed</text><!-- concentrated load 2 m from left --><line x1="250" y1="165" x2="250" y2="228" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="250" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">20 kN</text><!-- load position dimension --><line x1="110" y1="300" x2="250" y2="300" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="300" x2="136" y2="300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="248" y1="300" x2="224" y2="300" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="110" y1="294" x2="110" y2="306" stroke="#1a1a1a" stroke-width="1.2"/><line x1="250" y1="294" x2="250" y2="306" stroke="#1a1a1a" stroke-width="1.2"/><text x="180" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">2 m</text><!-- left fixed-end moment --><path d="M 136,192 A 24,24 0 1,1 184,192" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="160" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#1d4ed8">M<tspan dy="5" font-size="12">AB</tspan><tspan dy="-5"> = ?</tspan></text><!-- span dimension --><line x1="110" y1="356" x2="530" y2="356" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="356" x2="136" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="528" y1="356" x2="504" y2="356" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="110" y1="350" x2="110" y2="362" stroke="#1a1a1a" stroke-width="1.2"/><line x1="530" y1="350" x2="530" y2="362" stroke="#1a1a1a" stroke-width="1.2"/><text x="320" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">L = 6 m</text></svg>
