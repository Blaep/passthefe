<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Stress element with sigma-x 60 MPa tensile and sigma-y 20 MPa compressive; plane inclined at theta 30 degrees from the x-face; find the normal stress on that plane"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- stress element --><rect x="245" y="145" width="150" height="150" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- sigma_x = 60 MPa tensile (outward) --><line x1="245" y1="190" x2="200" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="245" y1="250" x2="200" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="395" y1="190" x2="440" y2="190" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="395" y1="250" x2="440" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="88" y="183" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4"> = 60 MPa</tspan></text><text x="192" y="201" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">tensile</text><text x="448" y="183" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4"> = 60 MPa</tspan></text><text x="448" y="201" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">tensile</text><!-- sigma_y = 20 MPa compressive (inward) --><line x1="290" y1="105" x2="290" y2="143" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="350" y1="105" x2="350" y2="143" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="290" y1="335" x2="290" y2="297" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="350" y1="335" x2="350" y2="297" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="268" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = 20 MPa</tspan></text><text x="320" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">compressive</text><text x="268" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = 20 MPa</tspan></text><text x="320" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">compressive</text><!-- inclined plane (dashed), 30 deg CCW from x-face --><line x1="265" y1="125" x2="375" y2="315" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,5"/><!-- outward normal at theta = 30 deg --><line x1="320" y1="220" x2="385" y2="182.5" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><path d="M 348,220 A 28,28 0 0,0 344.25,206" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="362" y="213" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">θ = 30°</text><text x="400" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#1d4ed8">σ<tspan dy="4" font-size="12">θ</tspan><tspan dy="-4"> = ?</tspan></text><text x="320" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">θ measured counterclockwise from the x-face; no shear stress</text></svg>
