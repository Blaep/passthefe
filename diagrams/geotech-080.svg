<svg xmlns="http://www.w3.org/2000/svg" width="480" height="225" viewBox="0 0 480 225" role="img" aria-label="Strip footing 4 feet wide carrying a line load of 14 kips per foot of length, with an ultimate bearing capacity of 9,600 psf"><rect width="480" height="225" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="40" y="110" width="400" height="100" fill="#efe3c7" stroke="#1a1a1a" stroke-width="2"/><rect x="200" y="95" width="80" height="15" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><rect x="230" y="60" width="20" height="35" fill="#8a8a8a" stroke="#1a1a1a" stroke-width="2"/><line x1="240" y1="20" x2="240" y2="58" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><text x="255" y="34" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">14 kip/ft</text><line x1="200" y1="135" x2="280" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="240.0" y="155" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">B = 4 ft</text><text x="240" y="195" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">q<tspan dy="4" font-size="11">ult</tspan><tspan dy="-4">​</tspan> = 9,600 psf</text></svg>