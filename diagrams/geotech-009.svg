<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Three-metre clay layer under a building; midpoint effective stress 90 kPa, added stress 60 kPa, settlement unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- building --><rect x="270" y="80" width="100" height="60" fill="#dbeafe" stroke="#1a1a1a" stroke-width="2"/><text x="320" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">building</text><!-- ground surface --><line x1="60" y1="140" x2="580" y2="140" stroke="#1a1a1a" stroke-width="2.5"/><!-- clay layer --><rect x="80" y="140" width="480" height="160" fill="#faf5e9" stroke="#1a1a1a" stroke-width="2.5"/><text x="470" y="165" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">clay layer</text><!-- surcharge arrow --><line x1="320" y1="140" x2="320" y2="172" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><!-- thickness dimension --><line x1="52" y1="142" x2="52" y2="298" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="42" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a" transform="rotate(-90 42 220)">3 m</text><!-- midpoint --><line x1="80" y1="220" x2="560" y2="220" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="7,4"/><text x="95" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">midpoint</text><circle cx="320" cy="220" r="5" fill="#1d4ed8"/><text x="336" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">σ′₀ = 90 kPa</text><text x="336" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">Δσ = 60 kPa</text><!-- settlement --><line x1="520" y1="150" x2="520" y2="192" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="520" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#1d4ed8">s<tspan baseline-shift="sub" font-size="75%">c</tspan> = ?</text></svg>
