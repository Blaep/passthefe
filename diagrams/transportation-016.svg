<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Crest vertical curve joining a plus 4 percent grade to a minus 4 percent grade; required stopping sight distance 196 ft with S greater than L, curve length unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- tangent extensions --><line x1="40" y1="335" x2="80" y2="320" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,4"/><line x1="560" y1="320" x2="600" y2="335" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,4"/><!-- curve --><path d="M80,320 Q320,230 560,320" fill="none" stroke="#1a1a1a" stroke-width="3.5"/><circle cx="80" cy="320" r="4" fill="#1a1a1a"/><circle cx="560" cy="320" r="4" fill="#1a1a1a"/><text x="80" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1a1a1a">PVC</text><text x="560" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1a1a1a">PVT</text><!-- grades --><text x="170" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">+4%</text><text x="470" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">-4%</text><!-- unknown length + data --><text x="320" y="376" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1d4ed8">L = ?</text><text x="320" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">required SSD = 196 ft (S &gt; L)</text></svg>
