<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Horizontal water jet striking a vertical flat plate"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- supply pipe --><rect x="60" y="198" width="120" height="44" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- free jet --><rect x="180" y="205" width="270" height="30" fill="#bfdbfe" stroke="none"/><!-- velocity arrow --><line x1="120" y1="172" x2="400" y2="172" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="260" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1d4ed8">v = 10 m/s</text><!-- jet diameter dimension --><line x1="195" y1="203" x2="195" y2="218" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="195" y1="237" x2="195" y2="222" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="208" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#1a1a1a">d = 50 mm</text><!-- vertical plate --><line x1="450" y1="140" x2="450" y2="340" stroke="#1a1a1a" stroke-width="4"/><line x1="450" y1="150" x2="466" y2="162" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="172" x2="466" y2="184" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="194" x2="466" y2="206" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="216" x2="466" y2="228" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="238" x2="466" y2="250" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="260" x2="466" y2="272" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="282" x2="466" y2="294" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="304" x2="466" y2="316" stroke="#1a1a1a" stroke-width="1.4"/><line x1="450" y1="326" x2="466" y2="338" stroke="#1a1a1a" stroke-width="1.4"/><!-- deflected streams --><path d="M450,208 C418,182 402,152 398,112" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><path d="M450,232 C418,258 402,288 398,328" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><!-- unknown force --><text x="450" y="398" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#1a1a1a">F = ?</text><text x="450" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">force on the plate</text></svg>
