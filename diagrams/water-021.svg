<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Front view of a 90-degree V-notch weir with 0.25 m head"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- weir plate --><rect x="140" y="110" width="360" height="260" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- V notch cut --><polygon points="260,110 380,110 320,250" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><!-- water flowing through the notch --><polygon points="294.3,190 345.7,190 320,250" fill="#bfdbfe" stroke="none"/><line x1="294.3" y1="190" x2="345.7" y2="190" stroke="#1d4ed8" stroke-width="2.5"/><!-- head dimension: water surface to notch apex --><line x1="420" y1="190" x2="420" y2="250" stroke="#1a1a1a" stroke-width="1.2"/><line x1="420" y1="192" x2="420" y2="216" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="420" y1="248" x2="420" y2="224" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="346" y1="190" x2="426" y2="190" stroke="#1a1a1a" stroke-width="1"/><line x1="320" y1="250" x2="426" y2="250" stroke="#1a1a1a" stroke-width="1"/><text x="470" y="226" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#1a1a1a">H = 0.25 m</text><!-- 90-degree angle at the apex --><path d="M311.3,229.8 A22,22 0 0,1 328.7,229.8" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="320" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">90°</text><!-- unknown discharge --><text x="320" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#1a1a1a">Q = ?</text></svg>
