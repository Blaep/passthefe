<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Level setup between a benchmark and a turning point with backsight and foresight rod readings"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- ground --><polyline points="40,360 250,360 430,322 600,322" fill="none" stroke="#1a1a1a" stroke-width="2.5"/><line x1="70" y1="360" x2="60" y2="372" stroke="#1a1a1a" stroke-width="1.4"/><line x1="110" y1="360" x2="100" y2="372" stroke="#1a1a1a" stroke-width="1.4"/><line x1="190" y1="360" x2="180" y2="372" stroke="#1a1a1a" stroke-width="1.4"/><line x1="470" y1="322" x2="460" y2="334" stroke="#1a1a1a" stroke-width="1.4"/><line x1="540" y1="322" x2="530" y2="334" stroke="#1a1a1a" stroke-width="1.4"/><!-- benchmark rod --><rect x="112" y="150" width="18" height="210" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><line x1="112" y1="336" x2="121" y2="336" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="312" x2="121" y2="312" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="288" x2="121" y2="288" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="264" x2="121" y2="264" stroke="#1a1a1a" stroke-width="1.2"/><line x1="112" y1="240" x2="130" y2="240" stroke="#1d4ed8" stroke-width="2"/><!-- turning point rod --><rect x="492" y="200" width="18" height="122" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><line x1="492" y1="297.6" x2="501" y2="297.6" stroke="#1a1a1a" stroke-width="1.2"/><line x1="492" y1="273.2" x2="501" y2="273.2" stroke="#1a1a1a" stroke-width="1.2"/><line x1="492" y1="240" x2="510" y2="240" stroke="#1d4ed8" stroke-width="2"/><!-- line of sight --><line x