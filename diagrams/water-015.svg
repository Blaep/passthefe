<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Pumped well in a confined aquifer with two observation wells"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f3f4f6"/><path d="M0,10 L10,0" stroke="#9ca3af" stroke-width="1.2"/></pattern></defs><!-- ground surface --><line x1="40" y1="110" x2="600" y2="110" stroke="#1a1a1a" stroke-width="2.5"/><!-- upper confining layer --><rect x="40" y="110" width="560" height="80" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="1.5"/><!-- confined aquifer --><rect x="40" y="190" width="560" height="100" fill="#dbeafe" stroke="#1a1a1a" stroke-width="1.5"/><!-- lower confining layer --><rect x="40" y="290" width="560" height="70" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="1.5"/><text x="120" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1a1a">confining layer</text><text x="120" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1a1a1a">confined aquifer</text><!-- aquifer thickness dimension --><line x1="58" y1="190" x2="58" y2="290" stroke="#1a1a1a" stroke-width="1.2"/><line x1="58" y1="192" x2="58" y2="216" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="58" y1="288" x2="58" y2="264" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="50" y="245" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">20 m</text><!-- pumped well --><line x1="292" y1="70" x2="292" y2="290" stroke="#1a1a1a" stroke-width="2.5"/><line x1="308" y1="70" x2="308" y2="290" stroke="#1a1a1a" stroke-width="2.5"/><line x1="300" y1="160" x2="300" y2="104" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="300" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" font-style="italic" fill="#1a1a1a">Q = ?</text><!-- near observation well (r = 0.20 m) --><line x1="330" y1="70" x2="330" y2="230" stroke="#1a1a1a" stroke-width="2"/><line x1="342" y1="70" x2="342" y2="230" stroke="#1a1a1a" stroke-width="2"/><line x1="326" y1="200" x2="346" y2="200" stroke="#1d4ed8" stroke-width="3"/><!-- far observation well (r = 100 m) --><line x1="520" y1="70" x2="520" y2="230" stroke="#1a1a1a" stroke-width="2"/><line x1="532" y1="70" x2="532" y2="230" stroke="#1a1a1a" stroke-width="2"/><line x1="516" y1="170" x2="536" y2="170" stroke="#1d4ed8" stroke-width="3"/><!-- piezometric surface --><line x1="536" y1="170" x2="342" y2="200" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7,4"/><line x1="342" y1="200" x2="308" y2="203" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7,4"/><text x="440" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" fill="#1d4ed8">piezometric surface</text><!-- head difference dimension --><line x1="566" y1="170" x2="566" y2="200" stroke="#1a1a1a" stroke-width="1.2"/><line x1="566" y1="172" x2="566" y2="184" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="566" y1="198" x2="566" y2="186" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="536" y1="170" x2="572" y2="170" stroke="#1a1a1a" stroke-width="1"/><line x1="342" y1="200" x2="572" y2="200" stroke="#1a1a1a" stroke-width="1"/><text x="578" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1a1a1a">3.0 m</text><!-- distance to far well --><line x1="342" y1="92" x2="520" y2="92" stroke="#1a1a1a" stroke-width="1.2"/><line x1="344" y1="92" x2="368" y2="92" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="518" y1="92" x2="494" y2="92" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="431" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1a1a1a">r = 100 m</text><!-- distance to near well --><line x1="308" y1="384" x2="330" y2="384" stroke="#1a1a1a" stroke-width="1.2"/><line x1="310" y1="384" x2="318" y2="384" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="328" y1="384" x2="320" y2="384" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><text x="319" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#1a1a1a">r = 0.20 m</text></svg>
