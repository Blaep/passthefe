<svg xmlns="http://www.w3.org/2000/svg" width="480" height="225" viewBox="0 0 480 225" role="img" aria-label="Direct shear test box with a normal force of 450 newtons on a 60 millimeter square specimen and a horizontal shear force applied to the upper half"><rect width="480" height="225" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="150" y="100" width="180" height="40" fill="#efe3c7" stroke="#1a1a1a" stroke-width="2"/><rect x="140" y="70" width="200" height="30" fill="#bdbdbd" stroke="#1a1a1a" stroke-width="2"/><rect x="140" y="140" width="200" height="30" fill="#bdbdbd" stroke="#1a1a1a" stroke-width="2"/><line x1="240" y1="30" x2="240" y2="66" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><text x="250" y="36" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">N = 450 N</text><line x1="340" y1="85" x2="420" y2="85" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="380" y="70" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">shear force</text><text x="240" y="125" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">soil 60 mm × 60 mm</text><text x="240" y="205" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">c = 10 kPa, φ = 30°</text></svg>