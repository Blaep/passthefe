<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="Pumped well in a confined aquifer with piezometric height 20 feet above the aquifer bottom at radius 0.5 feet and 26 feet at radius 200 feet"><rect width="480" height="250" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><line x1="40" y1="210" x2="440" y2="210" stroke="#1a1a1a" stroke-width="3"/><rect x="40" y="120" width="400" height="90" fill="#efe3c7" stroke="#1a1a1a" stroke-width="2"/><rect x="40" y="80" width="400" height="40" fill="#bbb" stroke="#1a1a1a" stroke-width="2"/><rect x="205" y="50" width="70" height="160" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><line x1="205" y1="50" x2="205" y2="210" stroke="#1a1a1a" stroke-width="3"/><line x1="275" y1="50" x2="275" y2="210" stroke="#1a1a1a" stroke-width="3"/><line x1="40" y1="52" x2="205" y2="70" stroke="#2e86c1" stroke-width="2" stroke-dasharray="5 3"/><line x1="275" y1="70" x2="440" y2="52" stroke="#2e86c1" stroke-width="2" stroke-dasharray="5 3"/><text x="240" y="20" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">pumped well</text><text x="50" y="40" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">h<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">​</tspan> = 26 ft at r<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">​</tspan> = 200 ft</text><text x="290" y="92" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">confining layer</text><text x="120" y="170" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">confined aquifer</text><text x="300" y="150" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#1a1a1a">h<tspan dy="4" font-size="11">1</tspan><tspan dy="-4">​</tspan> = 20 ft at r<tspan dy="4" font-size="11">1</tspan><tspan dy="-4">​</tspan> = 0.5 ft</text><text x="240" y="236" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a">T = 0.05 ft²/s, heights above the aquifer bottom</text></svg>