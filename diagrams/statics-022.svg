<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Bracket hinged along the y-axis with force F applied at point P"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- bracket plate in the x-z plane, hinged on the y-axis --><polygon points="220,300 360,300 320,328 180,328" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2"/><!-- coordinate axes --><line x1="220" y1="300" x2="580" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><line x1="220" y1="300" x2="110" y2="377" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="592" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1a1a1a">x</text><text x="98" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1a1a1a">z</text><text x="204" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#1a1a1a">O</text><!-- hinge (y) axis --><line x1="220" y1="420" x2="220" y2="60" stroke="#1d4ed8" stroke-width="3"/><rect x="212" y="288" width="16" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><rect x="212" y="158" width="16" height="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="238" y="66" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1d4ed8">y</text><text x="238" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1d4ed8">(hinge axis)</text><!-- moment about y indicator --><path d="M 241,111 A 28,28 0 1,0 199,111" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="258" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">M<tspan dy="5" font-size="12">y</tspan><tspan dy="-5"> = ?</tspan></text><!-- point P above the plate --><line x1="315" y1="297.5" x2="315" y2="317.5" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/><circle cx="315" cy="297.5" r="5" fill="#1d4ed8"/><text x="328" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#1d4ed8">P</text><!-- force vector F = (-60, 25, -40) N --><line x1="315" y1="297.5" x2="236" y2="221" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="292" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="italic" fill="#1d4ed8">F</text><text x="320" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">F = (−60i + 25j − 40k) N applied at P(0.60, 0.10, 0.25) m</text></svg>
