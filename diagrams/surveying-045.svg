<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-label="Two parallel cross sections 100 feet apart with end areas 450 and 380 square feet and a midway section of 420 square feet"><rect width="480" height="240" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><polygon points="80,150 110,50 130,50 160,150" fill="#cfd8c8" stroke="#1a1a1a" stroke-width="2"/><polygon points="330,150 360,60 380,60 410,150" fill="#cfd8c8" stroke="#1a1a1a" stroke-width="2"/><text x="120" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">A₁ = 450 ft²</text><text x="370" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">A₂ = 380 ft²</text><line x1="120" y1="100" x2="370" y2="100" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="120" y1="205" x2="370" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#ahs)" marker-end="url(#ah)"/><text x="245.0" y="225" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a">100 ft apart</text><polygon points="215,150 240,70 260,70 285,150" fill="#e3e3b8" stroke="#1a1a1a" stroke-width="2"/><text x="250" y="170" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">A<tspan dy="4" font-size="11">m</tspan><tspan dy="-4">​</tspan> = 420 ft²</text><text x="250" y="50" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">midway section</text></svg>