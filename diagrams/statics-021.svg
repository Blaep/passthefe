<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Free-body diagram of a 400 N crate on a frictionless 25 degree incline with force P parallel to the plane marked unknown, plus the normal force"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- smooth incline surface --><line x1="110" y1="340" x2="510" y2="153.4" stroke="#1a1a1a" stroke-width="2.5"/><!-- crate --><polygon points="334.5,169.1 234.8,215.6 260.1,269.9 359.8,223.5" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- force vectors from crate center --><line x1="297.3" y1="219.5" x2="297.3" y2="340" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><line x1="297.3" y1="219.5" x2="374.3" y2="183.6" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><line x1="297.3" y1="219.5" x2="271.9" y2="165.1" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="311" y="305" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">W = 400 N</text><text x="382" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">P = ?</text><text x="258" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1d4ed8">N</text><!-- 25 degree angle --><line x1="110" y1="340" x2="200" y2="340" stroke="#1a1a1a" stroke-width="1.2"/><path d="M 155,340 A 45,45 0 0,0 150.8,321" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="172" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">25°</text><text x="320" y="416" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#1a1a1a">frictionless surface</text></svg>
