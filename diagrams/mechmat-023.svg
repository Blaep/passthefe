<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Solid circular shaft under a bending moment of 800 N-m and a torque of 1200 N-m; find the maximum shear stress"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- shaft body --><rect x="170" y="195" width="300" height="50" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><ellipse cx="470" cy="220" rx="18" ry="25" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><ellipse cx="170" cy="220" rx="18" ry="25" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="2.5"/><text x="320" y="229" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">d = 50 mm</text><!-- bending moment arrows (vertical plane) --><path d="M 215,165 A 42,42 0 0,1 299,165" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><path d="M 425,165 A 42,42 0 0,0 341,165" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="257" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">M = 800 N·m</text><text x="383" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">M = 800 N·m</text><!-- torque arrows (around shaft axis, at the end faces) --><path d="M 170,195 A 18,25 0 1,1 170,245" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><path d="M 470,245 A 18,25 0 1,1 470,195" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="170" y="302" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">T = 1200 N·m</text><text x="470" y="302" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">T = 1200 N·m</text><text x="268" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1d4ed8">τ<tspan dy="5" font-size="13">max</tspan><tspan dy="-5"> = ?</tspan></text><text x="320" y="412" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1a1a1a">bending and torsion act simultaneously (Tresca basis)</text></svg>
