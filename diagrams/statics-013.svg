<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Rope wrapped one and a half turns around a fixed capstan; tight-side tension T1 and loose-side tension T2 marked"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- fixed capstan drum --><circle cx="320" cy="210" r="90" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="320" cy="210" r="7" fill="#1a1a1a"/><!-- rope: enters from the left, wraps 1.5 turns clockwise, exits to the left --><line x1="70" y1="113" x2="320" y2="113" stroke="#1a1a1a" stroke-width="3"/><path d="M 320,113 A 97,97 0 0,1 320,307 A 97,97 0 0,1 320,113 A 97,97 0 0,1 320,307" fill="none" stroke="#1a1a1a" stroke-width="3"/><line x1="320" y1="307" x2="70" y2="307" stroke="#1a1a1a" stroke-width="3"/><!-- tight-side tension arrow --><line x1="270" y1="113" x2="140" y2="113" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="205" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">T₁ (tight)</text><!-- loose-side tension arrow --><line x1="270" y1="307" x2="140" y2="307" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="205" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">T₂ (loose)</text><text x="320" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">rope wrapped 1.5 turns around a fixed capstan · μ_s = 0.30</text></svg>
