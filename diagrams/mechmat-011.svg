<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Two-dimensional stress element: sigma-x 80 MPa tensile, sigma-y 40 MPa compressive, tau-xy 30 MPa; find the principal stresses"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- stress element --><rect x="245" y="145" width="150" height="150" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- sigma_x = 80 MPa tensile (outward) --><line x1="245" y1="205" x2="200" y2="205" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="245" y1="245" x2="200" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="395" y1="205" x2="440" y2="205" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="395" y1="245" x2="440" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="88" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4"> = 80 MPa</tspan></text><text x="192" y="216" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">tensile</text><text x="448" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4"> = 80 MPa</tspan></text><text x="448" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">tensile</text><!-- sigma_y = 40 MPa compressive (inward) --><line x1="290" y1="105" x2="290" y2="143" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="350" y1="105" x2="350" y2="143" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="290" y1="335" x2="290" y2="297" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="350" y1="335" x2="350" y2="297" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="268" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = 40 MPa</tspan></text><text x="320" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">compressive</text><text x="268" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = 40 MPa</tspan></text><text x="320" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1d4ed8">compressive</text><!-- tau_xy = 30 MPa, standard positive convention --><line x1="403" y1="182" x2="403" y2="152" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="248" y1="130" x2="274" y2="130" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="237" y1="268" x2="237" y2="298" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><line x1="332" y1="303" x2="302" y2="303" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahb)"/><text x="415" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1d4ed8">τ<tspan dy="4" font-size="11">xy</tspan><tspan dy="-4"> = 30 MPa</tspan></text><!-- unknown --><text x="320" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1d4ed8">σ₁ = ? , σ₂ = ?</text></svg>
