<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Continuous beam: fixed support at the left, roller supports in the middle and at the right, no internal hinges; find the degree of static indeterminacy"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="12" stroke="#9ca3af" stroke-width="1.6"/></pattern></defs><!-- beam --><rect x="60" y="230" width="470" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/><!-- fixed wall at left --><rect x="60" y="160" width="50" height="150" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2.5"/><text x="85" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">fixed</text><!-- middle roller --><polygon points="313,266 347,266 330,242" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="330" cy="242" r="3.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><circle cx="321" cy="273" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="339" cy="273" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><line x1="299" y1="280" x2="361" y2="280" stroke="#1a1a1a" stroke-width="2.5"/><line x1="307" y1="280" x2="297" y2="292" stroke="#1a1a1a" stroke-width="1.4"/><line x1="329" y1="280" x2="319" y2="292" stroke="#1a1a1a" stroke-width="1.4"/><line x1="351" y1="280" x2="341" y2="292" stroke="#1a1a1a" stroke-width="1.4"/><!-- right roller --><polygon points="503,266 537,266 520,242" fill="#ffffff