<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Free-body diagram of a 500 N block on a 30 degree incline with force P up the plane marked unknown, plus friction and normal forces"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- incline surface with ground hatching --><line x1="110" y1="350" x2="510" y2="119" stroke="#1a1a1a" stroke-width="2.5"/><line x1="110" y1="350" x2="103" y2="361" stroke="#1a1a1a" stroke-width="1.4"/><line x1="143" y1="331" x2="136" y2="342" stroke="#1a1a1a" stroke-width="1.4"/><line x1="176" y1="311.9" x2="169" y2="322.9" stroke="#1a1a1a" stroke-width="1.4"/><line x1="209" y1="292.8" x2="202" y2="303.8" stroke="#1a1a1a" stroke-width="1.4"/><line x1="242" y1="273.8" x2="235" y2="284.8" stroke="#1a1a1a" stroke-width="1.4"/><line x1="275" y1="254.7" x2="268" y2="265.7" stroke="#1a1a1a" stroke-width="1.4"/><line x1="308" y1="235.7" x2="301" y2="246.7" stroke="#1a1a1a" stroke-width="1.4"/><line x1="341" y1="216.6" x2="334" y2="227.6" stroke="#1a1a1a" stroke-width="1.4"/><line x1="374" y1="197.6" x2="367" y2="208.6" stroke="#1a1a1a" stroke-width="1.4"/><line x1="407" y1="178.5" x2="400" y2="189.5" stroke="#1a1a1a" stroke-width="1.4"/><line x1="440" y1="159.5" x2="433" y2="170.5" stroke="#1a1a1a" stroke-width="1.4"/><line x1="473" y1="140.4" x2="466" y2="151.4" stroke="#1a1a1a" stroke-width="1.4"/><line x1="506" y1="121.4" x2="499" y2="132.4" stroke="#1a1a1a" stroke-width="1.4"/><!-- block --><polygon points="327.6,155.0 232.4,210.0 262.4,262.0 357.6,207.0" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- force vectors from block center --><line x