<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="A 200 N sign hanging from a knot by two cables: left cable at 60 degrees to horizontal, right cable at 45 degrees; left cable tension marked unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- horizontal support with ceiling ticks --><line x1="80" y1="90" x2="560" y2="90" stroke="#1a1a1a" stroke-width="3"/><line x1="100" y1="90" x2="100" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><line x1="180" y1="90" x2="180" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><line x1="260" y1="90" x2="260" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><line x1="340" y1="90" x2="340" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><line x1="420" y1="90" x2="420" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><line x1="500" y1="90" x2="500" y2="74" stroke="#1a1a1a" stroke-width="1.5"/><!-- cables --><line x1="222" y1="90" x2="320" y2="260" stroke="#1a1a1a" stroke-width="2.5"/><line x1="490" y1="90" x2="320" y2="260" stroke="#1a1a1a" stroke-width="2.5"/><!-- tension vectors along cables --><line x1="320" y1="260" x2="285" y2="199.4" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><line x1="320" y1="260" x2="369.5" y2="210.5" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><circle cx="320" cy="260" r="5" fill="#1d4ed8"/><!-- 60 degree angle at left attachment --><path d="M 257,90 A 35,35 0 0,1 239.5,120.3" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="268" y="120" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">60°</text><!-- 45 degree angle at right attachment --><path d="M 455,90 A 35,35 0 0,1 465.2,114.8" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="448" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">45°</text><text x="238" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">T<tspan dy="4" font-size="11">left</tspan><tspan dy="-4"> = ?</tspan></text><text x="428" y="198" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">T<tspan dy="4" font-size="11">right</tspan></text><!-- hanging wire and sign --><line x1="320" y1="265" x2="320" y2="300" stroke="#1a1a1a" stroke-width="2"/><rect x="250" y="300" width="140" height="50" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- weight vector --><line x1="320" y1="350" x2="320" y2="398" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="334" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">200 N</text></svg>
