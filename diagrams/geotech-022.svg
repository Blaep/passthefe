<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Four-metre smooth vertical wall with triangular Rankine passive pressure distribution on level backfill; total passive force unknown"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="context-stroke"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><text x="151" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1a1a1a">wall</text><!-- soil --><rect x="162" y="120" width="418" height="210" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- ground surface --><line x1="162" y1="120" x2="580" y2="120" stroke="#1a1a1a" stroke-width="2.5"/><text x="400" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">level ground surface</text><!-- wall --><rect x="140" y="100" width="22" height="220" fill="#d1d5db" stroke="#1a1a1a" stroke-width="2.5"/><!-- passive pressure triangle --><polygon points="162,120 162,320 332,320" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><!-- pressure arrows --><line x1="204" y1="170" x2="164" y2="170" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><line x1="247" y1="220" x2="164" y2="220" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><line x1="289" y1="270" x2="164" y2="270" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><line x1="327" y1="315" x2="164" y2="315" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ahb)"/><!-- resultant --><line x1="420" y1="253" x2="166" y2="253" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#ahb)"/><text x="430" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#1d4ed8">Pₚ = ?</text><!-- soil data --><text x="455" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">φ = 28°</text><text x="455" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">γ = 19 kN/m³</text><!-- wall height dimension --><line x1="110" y1="122" x2="110" y2="318" stroke="#1a1a1a" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="100" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a" transform="rotate(-90 100 220)">4 m</text></svg>
