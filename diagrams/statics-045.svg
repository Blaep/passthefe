<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215" role="img" aria-label="Rope wrapped around a fixed post for 1.5 turns (drawn schematically) with a holding force of 80 pounds on one end and an unknown force on the other"><rect width="480" height="215" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><circle cx="240" cy="110" r="38" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="3"/><path d="M 220 74 A 38 38 0 1 1 202 128" fill="none" stroke="#8a5a2b" stroke-width="3"/><line x1="220" y1="72" x2="60" y2="72" stroke="#8a5a2b" stroke-width="3"/><line x1="215" y1="148" x2="60" y2="148" stroke="#8a5a2b" stroke-width="3"/><line x1="115" y1="72" x2="70" y2="72" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><line x1="115" y1="148" x2="70" y2="148" stroke="#1a1a1a" stroke-width="3" marker-end="url(#ah)"/><text x="60" y="60" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">F<tspan dy="4" font-size="11">1</tspan><tspan dy="-4">​</tspan> (to find)</text><text x="60" y="172" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">F<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">​</tspan> = 80 lb holding force</text><text x="290" y="200" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a">wrap 1.5 turns, μ = 0.25</text><text x="240" y="114" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#1a1a1a">post</text></svg>