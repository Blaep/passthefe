<svg xmlns="http://www.w3.org/2000/svg" width="480" height="245" viewBox="0 0 480 245" role="img" aria-label="Plane stress element with normal stress sigma x of 60 ksi, sigma y of 20 ksi and shear stress tau xy of 15 ksi"><rect width="480" height="245" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahs" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M9,0 L0,3 L9,6 Z" fill="#1a1a1a"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#c0392b"/></marker></defs><rect x="190" y="60" width="100" height="100" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2"/><line x1="290" y1="110" x2="345" y2="110" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><line x1="190" y1="110" x2="135" y2="110" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><line x1="240" y1="60" x2="240" y2="12" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><line x1="240" y1="160" x2="240" y2="208" stroke="#c0392b" stroke-width="3" marker-end="url(#ah)"/><text x="352" y="115" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4">​</tspan> = 60 ksi</text><text x="250" y="22" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4">​</tspan> = 20 ksi</text><line x1="305" y1="165" x2="305" y2="135" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/><line x1="176" y1="55" x2="176" y2="85" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/><line x1="255" y1="47" x2="285" y2="47" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/><line x1="225" y1="173" x2="195" y2="173" stroke="#2e86c1" stroke-width="2.5" marker-end="url(#ah)"/><text x="312" y="160" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#1a1a1a">τ<tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">​</tspan> = 15 ksi</text><text x="240" y="232" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#1a1a1a">σ<tspan dy="4" font-size="11">x</tspan><tspan dy="-4">​</tspan>, σ<tspan dy="4" font-size="11">y</tspan><tspan dy="-4">​</tspan>: tension.  τ<tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">​</tspan>: positive direction as drawn</text></svg>