"1.4"/><!-- crate --><rect x="230" y="120" width="180" height="280" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><!-- applied horizontal force at the top edge --><line x1="140" y1="120" x2="226" y2="120" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="183" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" font-style="italic" fill="#1d4ed8">P</text><!-- weight --><line x1="320" y1="250" x2="320" y2="330" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="334" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1d4ed8">W = 500 N</text><!-- normal at the base --><line x1="320" y1="396" x2="320" y2="350" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="334" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1d4ed8">N</text><!-- friction at the base --><line x1="315" y1="388" x2="245" y2="388" stroke="#1d4ed8" stroke-width="3" marker-end="url(#ahb)"/><text x="280" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1d4ed8">F</text><!-- 1.4 m height dimension --><line x1="205" y1="120" x2="205" y2="400" stroke="#1a1a1a" stroke-width="1.2"/><line x1="205" y1="122" x2="205" y2="98" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="205" y1="398" x2="205" y2="422" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/><line x1="199" y1="120" x2="211" y2="120" stroke="#1a1a1a" stroke-width="1.2"/><line x1="199" y1="400" x2="211" y2="400" stroke="#1a1a1a" stroke-width="1.2"/><text x="183" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a" transform="rotate(-90 183 260)">1.4 m</text><!-- 0.9 m width dimension --><line x1="230" y1="430" x2="410" y2="430" stroke="#1a1a1a" stroke-width="1.2"/><line x1="232" y1="430" x2="256" y2="430" stroke="#1a1a1