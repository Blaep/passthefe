<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Parcel boundary with corners A, B, C, D at given coordinates"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- north arrow --><line x1="70" y1="120" x2="70" y2="66" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><text x="70" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1a1a1a">N</text><!-- parcel polygon A(0,0) B(200,0) C(200,120) D(60,80) --><polygon points="100,340 540,340 540,76 232,164" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="100" cy="340" r="5" fill="#1d4ed8"/><circle cx="540" cy="340" r="5" fill="#1d4ed8"/><circle cx="540" cy="76" r="5" fill="#1d4ed8"/><circle cx="232" cy="164" r="5" fill="#1d4ed8"/><!-- corner labels --><text x="100" y="370" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">A (0, 0)</text><text x="540" y="370" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">B (200, 0)</text><text x="540" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">C (200, 120)</text><text x="232" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">D (60, 80)</text><!-- area unknown --><text x="353" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1a1a1a">Area = ?</text></svg>
