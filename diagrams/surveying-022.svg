<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-label="Horizontal curve staked from the PC showing the deflection angle from the tangent to the first 20 meter sub-chord"><rect width="640" height="440" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1a1a1a"/></marker><marker id="ahb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#1d4ed8"/></marker></defs><!-- curve --><path d="M 140,330 C 280,330 380,300 560,262" fill="none" stroke="#1a1a1a" stroke-width="2.8"/><!-- tangent --><line x1="140" y1="330" x2="580" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)"/><!-- sub-chord PC to first stake --><line x1="140" y1="330" x2="258" y2="324" stroke="#1d4ed8" stroke-width="2.5"/><!-- PC --><circle cx="140" cy="330" r="5" fill="#1a1a1a"/><text x="122" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#1a1a1a">PC</text><!-- first stake --><circle cx="258" cy="324" r="4.5" fill="#1a1a1a"/><text x="258" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a">first stake</text><!-- deflection angle arc --><path d="M 195,330 A 55 55 0 0 0 194.9,327.2" fill="none" stroke="#1d4ed8" stroke-width="1.8"/><line x1="195" y1="328.6" x2="212" y2="346" stroke="#1a1a1a" stroke-width="1.2"/><text x="218" y="352" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#1d4ed8">δ = ?</text><!-- chord length label --><text x="199" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1d4ed8">20 m</text><!-- labels --><text x="445" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#1a1a1a">R = 250 m</text><text x="480" y="354" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#1a1a1a">tangent</text></svg>
